[project]
name = "smp-ppea"
version = "0.3.5"
description = "Stratified Multi-Proxy Prediction-Powered E-Audits"
requires-python = ">=3.10"

[project.dependencies]
torch = ">=2.1.0"
hydra-core = ">=1.3.2"
wandb = ">=0.16.0"
optuna = ">=3.6.0"
datasets = ">=2.16.0"
transformers = ">=4.38.0"
accelerate = ">=0.27.0"
matplotlib = ">=3.8.0"
seaborn = ">=0.13.0"
pandas = ">=2.2.0"
scipy = ">=1.12.0"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"
